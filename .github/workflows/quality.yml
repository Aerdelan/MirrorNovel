name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 每个包一个独立任务；失败时把错误摘要写进 annotations（无需登录即可见），
# 否则"Sign in to view logs"会把排查卡在登录上。
jobs:
  server:
    name: server · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: |
          npm config get registry
          npm ci --no-audit --no-fund

      - name: Test
        working-directory: server
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/server-test.log

      - name: Report test failures as annotations
        if: failure()
        run: |
          echo "### server test 失败摘要" >> "$GITHUB_STEP_SUMMARY"
          grep -E "✖|not ok [0-9]+|failing|# Subtest.*fail" /tmp/server-test.log | head -30 >> "$GITHUB_STEP_SUMMARY" || true
          grep -A 18 -m 3 -E "✖|not ok [0-9]+" /tmp/server-test.log | head -120 >> "$GITHUB_STEP_SUMMARY" || true
          grep -m 6 -E "✖|not ok [0-9]+|Error \[|AssertionError|Error:" /tmp/server-test.log | while read -r line; do echo "::error::${line:0:400}"; done || true

  client:
    name: client · test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: |
          npm config get registry
          npm ci --no-audit --no-fund

      - name: Test
        working-directory: client
        run: npm test

      - name: Check i18n
        working-directory: client
        run: npm run check:i18n

      - name: Build
        working-directory: client
        run: npm run build

  admin:
    name: admin · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install and build
        working-directory: admin
        run: |
          npm ci --no-audit --no-fund
          npm run build

  desktop:
    name: desktop · build renderer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: |
          npm config get registry
          npm ci --no-audit --no-fund

      - name: Build renderer
        working-directory: desktop
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/desktop-build.log

      - name: Report build failure as annotations
        if: failure()
        run: |
          echo "### desktop build 失败摘要" >> "$GITHUB_STEP_SUMMARY"
          grep -n -iE "error|failed|cannot|not found|exception" /tmp/desktop-build.log | tail -30 >> "$GITHUB_STEP_SUMMARY" || true
          grep -iE "error|failed|cannot|not found|exception" /tmp/desktop-build.log | tail -8 | while read -r line; do echo "::error::${line:0:400}"; done || true
