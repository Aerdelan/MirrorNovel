name: Build Desktop App (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    # 兜底：仓库 .npmrc 里若写了本机专属路径（例如 cache=E:/npm-cache），CI 也强制用 runner 自己的目录，
    # 否则 npm 会因为盘符不存在直接 ENOENT 失败（首次运行 v1.0.0 就是这么挂的）。
    env:
      NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache
      ELECTRON_CACHE: ${{ runner.temp }}\electron-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Show environment
        working-directory: desktop
        run: |
          node -v
          npm -v
          npm config get cache
          npm config get registry

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer (NSIS)
        working-directory: desktop
        run: npm run dist
        env:
          # 官方源（CI 在国外，比 npmmirror 稳）
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirrorNovel-Windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
          retention-days: 30

      # 打 tag 时把安装包挂到 GitHub Release（资源托管下载入口）
      - name: Attach installer to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
