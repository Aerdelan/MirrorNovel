name: Build Desktop App (Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'client/**'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'v*'
  workflow_dispatch:

# 同一次推送的新构建会取消还在跑的旧构建，避免排队
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            admin/package-lock.json
            desktop/package-lock.json

      - name: Show environment
        working-directory: desktop
        run: |
          node -v
          npm -v
          npm config get cache
          npm config get registry

      - name: Install and test server
        working-directory: server
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Install, test and build client
        working-directory: client
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check:i18n
          npm run build

      - name: Install and build admin
        working-directory: admin
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        # 兜底：仓库 .npmrc 里若写了本机专属缓存路径（例如 cache=E:/npm-cache），
        # 这里强制改回 runner 自己的临时目录，否则 npm 会因盘符不存在直接 ENOENT 失败。
        # 注意：runner 上下文只在 step 级可用，写在 job 级 env 会让整个工作流文件非法。
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}\npm-cache
        run: npm ci --no-audit --no-fund

      - name: Build desktop renderer
        working-directory: desktop
        run: npm run build

      - name: Build installer (NSIS)
        working-directory: desktop
        env:
          # 官方源（CI 在国外，比 npmmirror 稳）
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirrorNovel-Windows-${{ github.run_number }}
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
          retention-days: 30

      # 打 tag 时把安装包挂到 GitHub Release（资源托管下载入口）
      - name: Attach installer to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
